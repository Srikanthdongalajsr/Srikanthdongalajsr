name: Refresh videos and stats
on:
  schedule:
    - cron: "30 1 * * *"   # daily, 7:00 AM IST
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/update_videos.py
      - run: python tools/build_stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/stats-*.svg
          git diff --cached --quiet || { git commit -m "Refresh videos and stats" && git push; }
